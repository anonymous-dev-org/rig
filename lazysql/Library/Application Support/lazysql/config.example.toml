# Shared defaults for each user's ignored config.toml.
# Keep database connections, credentials, environment values, and machine paths out of git.

[application]
DefaultPageSize = 300
DisableSidebar = false
SidebarOverlay = false
MaxQueryHistoryPerConnection = 100
TreeWidth = 30
JSONViewerWordWrap = false
EnterOpensJSONViewer = false
ConfirmOnQuit = true

[keymap]
[keymap.Tree]
PageNext = 'Ctrl-J'
PagePrev = 'Ctrl-K'

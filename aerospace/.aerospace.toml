# AeroSpace config - cardinal desktops with manual layouts (no auto-grid)
config-version = 2
persistent-workspaces = ['n', 'e', 's', 'w']
# Each display has groups 1..9 of n -> e -> s -> w.
# Group 1 uses legacy names; groups 2..9 append -gN, e.g. e2-g3.
# Workspace IDs are <position> for slot 1; append the slot for slots 2+, e.g. n, e2.
# Display slot 1 is always the Mac built-in display when present; external
# displays are assigned after it, independent of left-to-right monitor order.
# Bindings act on the focused monitor via scripts in $HOME/.config/aerospace/scripts/.

after-login-command = []
after-startup-command = [
    'exec-and-forget $HOME/.config/aerospace/scripts/normalize-display-workspaces.sh --show',
]

start-at-login = true

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Always split monitors horizontally (left/right) by default
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

[mode.main.binding]

# --- Window focus inside a workspace: alt + hjkl
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- Move windows within layout: alt + shift + hjkl
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Numbered groups on the focused display; preserve direction
alt-1 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 1'
alt-2 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 2'
alt-3 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 3'
alt-4 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 4'
alt-5 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 5'
alt-6 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 6'
alt-7 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 7'
alt-8 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 8'
alt-9 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 9'

# --- Cardinal desktop navigation on focused display: cmd + alt + hjkl
# Vim-style positions: h=W  j=S  k=N  l=E
cmd-alt-k = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh n'
cmd-alt-h = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh w'
cmd-alt-l = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh e'
cmd-alt-j = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh s'

# --- Send focused window to a cardinal desktop on the focused display
cmd-alt-shift-k = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh n'
cmd-alt-shift-h = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh w'
cmd-alt-shift-l = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh e'
cmd-alt-shift-j = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh s'

# Resize mode
alt-r = 'mode resize'

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-f = 'fullscreen'

# Workspace back-and-forth
alt-tab = 'workspace-back-and-forth'

# Displays: jump focus / send window across screens
alt-m       = 'exec-and-forget $HOME/.config/aerospace/scripts/focus-display.sh next'
alt-shift-m = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-display.sh next'

# Directional monitor focus by physical arrangement: ctrl + alt + cmd + hjkl
ctrl-alt-cmd-h = 'exec-and-forget $HOME/.config/aerospace/scripts/focus-display.sh left'
ctrl-alt-cmd-j = 'exec-and-forget $HOME/.config/aerospace/scripts/focus-display.sh down'
ctrl-alt-cmd-k = 'exec-and-forget $HOME/.config/aerospace/scripts/focus-display.sh up'
ctrl-alt-cmd-l = 'exec-and-forget $HOME/.config/aerospace/scripts/focus-display.sh right'

# Send focused window to the monitor in that direction (and follow focus)
ctrl-alt-cmd-shift-h = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-display.sh left'
ctrl-alt-cmd-shift-j = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-display.sh down'
ctrl-alt-cmd-shift-k = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-display.sh up'
ctrl-alt-cmd-shift-l = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-display.sh right'

# Manual splits and grouping of existing neighbors
alt-b = 'split horizontal'
alt-v = 'split vertical'
alt-shift-b = 'join-with right'
alt-shift-v = 'join-with down'
alt-e = 'layout tiles horizontal vertical'
alt-w = 'layout accordion horizontal vertical'
alt-shift-space = 'layout floating tiling'
alt-shift-c = 'reload-config'

# Clipboard history
alt-c = 'exec-and-forget open raycast://extensions/raycast/clipboard-history/clipboard-history'

# App launchers
alt-t = 'exec-and-forget open -na kitty --args --single-instance -d $HOME'
alt-s = '''exec-and-forget osascript -e 'tell application "Safari" to make new document' '''
alt-f = 'exec-and-forget open -a Finder ~'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'
enter = 'mode main'

# Foundational shortcuts remain application-independent in every mode.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-1 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 1'
alt-2 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 2'
alt-3 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 3'
alt-4 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 4'
alt-5 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 5'
alt-6 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 6'
alt-7 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 7'
alt-8 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 8'
alt-9 = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-group.sh 9'
cmd-alt-k = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh n'
cmd-alt-h = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh w'
cmd-alt-l = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh e'
cmd-alt-j = 'exec-and-forget $HOME/.config/aerospace/scripts/switch-workspace.sh s'
cmd-alt-shift-k = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh n'
cmd-alt-shift-h = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh w'
cmd-alt-shift-l = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh e'
cmd-alt-shift-j = 'exec-and-forget $HOME/.config/aerospace/scripts/move-to-workspace.sh s'

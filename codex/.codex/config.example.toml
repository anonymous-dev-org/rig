#:schema https://developers.openai.com/codex/config-schema.json

# Shared starting point for ~/.codex/config.toml.
# Copy to config.toml for local use. Keep secrets, environment values, machine paths,
# trust, plugin state, notifications, marketplace metadata, and hook hashes out of git.

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
service_tier = "fast"

[tui]
notifications = ["agent-turn-complete", "approval-requested"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.openaiDeveloperDocs.tools.fetch_openai_doc]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs.tools.search_openai_docs]
approval_mode = "approve"

[features]
memories = true
terminal_resize_reflow = true
js_repl = false

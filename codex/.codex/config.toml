model = "gpt-5.5"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
notify = [
  "bash",
  "-lc",
  "case \"$1\" in *'\"type\":\"agent-turn-complete\"'*|*'\"type\":\"approval-requested\"'*) afplay /System/Library/Sounds/Blow.aiff >/dev/null 2>&1 & ;; esac",
  "codex-notify",
]
service_tier = "default"

[tui]
notifications = ["agent-turn-complete", "approval-requested"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[notice]
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.openaiDeveloperDocs.tools.fetch_openai_doc]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs.tools.search_openai_docs]
approval_mode = "approve"

[mcp_servers.XcodeBuildMCP]
command = "npx"
args = ["-y", "xcodebuildmcp@latest", "mcp"]

[features]
memories = true
terminal_resize_reflow = true

[projects."/Users/p78tr4/Documents/anonymous/rig"]
trust_level = "trusted"

[projects."/Users/p78tr4/Documents/anonymous/0x0"]
trust_level = "trusted"

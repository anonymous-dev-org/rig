# vim:fileencoding=utf-8:foldmethod=marker

include ghosty.conf

macos_secure_keyboard_entry no

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

font_size 13.5

enable_audio_bell no
window_alert_on_bell yes
macos_dock_badge_on_bell yes
command_on_bell sh -lc 'exec "$HOME/.config/kitty/on-bell-notify.sh"'
bell_on_tab "🔔 "

# Tab bar
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_margin_width 4.0
tab_bar_margin_height 4.0 4.0
tab_title_max_length 20
tab_bar_min_tabs 1
active_tab_foreground   #e0dbd2
active_tab_background   #3a3835
active_tab_font_style   bold
inactive_tab_foreground #807a72
inactive_tab_background #252422
inactive_tab_font_style normal
tab_bar_background #1c1b1a
tab_bar_margin_color #1c1b1a

# Tab navigation: ctrl+alt
map ctrl+alt+h previous_tab
map ctrl+alt+l next_tab
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
map ctrl+alt+shift+h move_tab_backward
map ctrl+alt+shift+l move_tab_forward

# Disable unused default bindings
map kitty_mod+enter no_op
map cmd+enter no_op
map kitty_mod+] no_op
map kitty_mod+[ no_op
map kitty_mod+f no_op
map kitty_mod+b no_op
map kitty_mod+` no_op
map kitty_mod+r no_op

# New tabs/windows use current directory
map kitty_mod+t launch --type=tab --cwd=current
map cmd+t       launch --type=tab --cwd=current
map kitty_mod+n launch --type=os-window --cwd=current
map cmd+n       launch --type=os-window --cwd=current
